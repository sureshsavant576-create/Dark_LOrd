<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f4f5f3" />
  <meta name="description" content="Turn student project requirements into technically matched, fairly allocated access to shared college laboratory resources." />
  <title>LabLink · GenAI Campus Lab Resource Exchange</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <a class="skip-link" href="#content">Skip to dashboard content</a>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#discover" aria-label="LabLink home"><span class="brand-mark">L</span><span>lablink<span class="brand-dot">.</span></span></a>
      <div class="campus-label">CAMPUS WORKSPACE</div>
      <nav class="nav-list" aria-label="Main navigation">
        <button class="nav-item active" data-view="discover"><span class="nav-icon">⌕</span><span>Discover</span><kbd>/</kbd></button>
        <button class="nav-item" data-view="bookings"><span class="nav-icon">▤</span><span>My requests</span><span class="nav-count" id="request-count">0</span></button>
        <button class="nav-item faculty-nav hidden" data-view="review"><span class="nav-icon">✓</span><span>Review requests</span><span class="nav-count" id="pending-count">0</span></button>
        <button class="nav-item admin-nav hidden" data-view="insights"><span class="nav-icon">▥</span><span>Resource insights</span></button>
      </nav>
      <div class="sidebar-spacer"></div>
      <div class="sidebar-footer"><span class="status-dot"></span> Campus demo <span class="footer-muted">· v1.0</span></div>
    </aside>
    <main class="main-area">
      <header class="topbar">
        <button class="mobile-menu icon-button" aria-label="Open navigation" data-action="menu">☰</button>
        <div class="breadcrumbs"><span>Workspace</span><span class="crumb-slash">/</span><strong id="breadcrumb-current">Discover</strong></div>
        <div class="topbar-right"><label class="user-switch"><span class="user-avatar" id="user-avatar">AS</span><select id="user-select" aria-label="Choose demo role and user"></select></label></div>
      </header>
      <section class="content" id="content" aria-live="polite"></section>
    </main>
  </div>
  <div class="toast-region" id="toasts" aria-live="polite" aria-atomic="true"></div>
  <dialog id="dialog" class="dialog"></dialog>
  <script type="module" src="/app.js"></script>
</body>
</html>
